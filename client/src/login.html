<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Zaytun — ورود</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/settings-apply.js"></script>
</head>
<body>
  <div class="app-shell">
    <div class="titlebar">
      <div class="titlebar__mark"><b>ZAY</b>TUN</div>
      <div class="titlebar__controls">
        <button class="titlebar__btn" id="min"><svg viewBox="0 0 12 12"><rect y="5.5" width="12" height="1.4" fill="currentColor"/></svg></button>
        <button class="titlebar__btn close" id="close"><svg viewBox="0 0 12 12"><line x1="0" y1="0" x2="12" y2="12" stroke="currentColor" stroke-width="1.4"/><line x1="12" y1="0" x2="0" y2="12" stroke="currentColor" stroke-width="1.4"/></svg></button>
      </div>
    </div>

    <div class="app-body auth-body">
      <div class="auth-brand">
        <div class="auth-brand__foot">GROUP · PRIVATE · ENCRYPTED LINE</div>
        <div class="auth-brand__word">
          <span style="animation-delay:.05s">Z</span><span style="animation-delay:.1s">a</span><span style="animation-delay:.15s" class="g">y</span><span style="animation-delay:.2s">t</span><span style="animation-delay:.25s">u</span><span style="animation-delay:.3s">n</span>
        </div>
        <p class="auth-brand__tag">خط ارتباطی مخصوص گروه رفیقا. فقط برای کسایی که دعوتن، بدون هیچ غریبه‌ای.</p>
      </div>

      <div class="auth-form-wrap">
        <form class="auth-form" id="loginForm">
          <h1>ورود</h1>
          <p class="sub">با نام کاربری و رمز عبورت وارد شو.</p>

          <div class="form-msg" id="msg"></div>

          <div class="field">
            <label>نام کاربری</label>
            <input type="text" id="username" autocomplete="username" placeholder="مثلاً: sina" />
          </div>
          <div class="field">
            <label>رمز عبور</label>
            <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" />
          </div>

          <button type="submit" class="btn" id="submitBtn">ورود به Zaytun</button>

          <div class="auth-switch small">
            <a id="goForgot">رمز عبورت رو فراموش کردی؟</a>
          </div>

          <div class="auth-switch">
            حساب نداری؟ <a id="goRegister">ثبت‌نام کن</a>
          </div>
          <div class="made-by">ساخته شده توسط <b>هومن</b></div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
