<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Zaytun</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/settings-apply.js"></script>
</head>
<body>
  <div class="app-shell">
    <div class="titlebar">
      <div class="titlebar__mark"><b>ZAY</b>TUN</div>
      <div class="titlebar__controls">
        <button class="titlebar__btn" id="min"><svg viewBox="0 0 12 12"><rect y="5.5" width="12" height="1.4" fill="currentColor"/></svg></button>
        <button class="titlebar__btn close" id="close"><svg viewBox="0 0 12 12"><line x1="0" y1="0" x2="12" y2="12" stroke="currentColor" stroke-width="1.4"/><line x1="12" y1="0" x2="0" y2="12" stroke="currentColor" stroke-width="1.4"/></svg></button>
      </div>
    </div>

    <div class="app-body chat-layout">
      <aside class="sidebar">
        <div class="sidebar__me">
          <button class="icon-btn" id="openSettingsBtn" title="تنظیمات">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 005 14.4a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09A1.65 1.65 0 0015.4 4.6a1.65 1.65 0 001.82.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          </button>
          <div class="avatar" id="meAvatar"></div>
          <div class="sidebar__me-info">
            <div class="me-name" id="meName"></div>
            <div class="me-tag" id="meTag"></div>
          </div>
        </div>
        <div class="sidebar__label">اعضای گروه</div>
        <div class="member-list" id="memberList"></div>
        <div class="sidebar__foot">
          <button class="btn btn--ghost" id="logoutBtn">خروج</button>
        </div>
      </aside>

      <section class="chat-panel">
        <div class="chat-header" id="chatHeader" style="display:none;">
          <div class="avatar" id="headerAvatar"></div>
          <div>
            <div class="name" id="headerName"></div>
            <div class="presence" id="headerPresence">آفلاین</div>
          </div>
        </div>
        <div class="chat-empty" id="chatEmpty">یه نفر رو از لیست انتخاب کن.</div>

        <div class="messages" id="messages" style="display:none;"></div>
        <div class="typing-hint" id="typingHint"></div>
        <div class="composer" id="composer" style="display:none;">
          <div class="composer__attach-row">
            <button class="icon-btn" id="emojiBtn" title="ایموجی">🙂</button>
            <button class="icon-btn" id="imageBtn" title="ارسال عکس">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </button>
            <button class="icon-btn" id="videoBtn" title="ارسال ویدیو">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            </button>
            <button class="icon-btn" id="fileBtn" title="ارسال فایل">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <div class="emoji-picker" id="emojiPicker" style="display:none;"></div>
          </div>
          <div class="composer__input-row">
            <input type="text" id="messageInput" placeholder="پیامت رو بنویس..." autocomplete="off" />
            <button class="send" id="sendBtn">
              <svg viewBox="0 0 24 24"><path d="M3 20l18-8L3 4v6l12 2-12 2v6z"/></svg>
            </button>
          </div>
          <input type="file" id="imageInput" accept="image/*" style="display:none;" />
          <input type="file" id="videoInput" accept="video/*" style="display:none;" />
          <input type="file" id="fileInput" style="display:none;" />
        </div>
      </section>
    </div>

    <div class="modal-overlay" id="deleteModal" style="display:none;">
      <div class="modal">
        <h2>حذف حساب</h2>
        <p class="sub">این کار برگشت‌ناپذیره. حساب و تمام پیام‌هات برای همیشه پاک میشن. برای تایید، رمز عبورت رو وارد کن.</p>
        <div class="form-msg" id="deleteMsg"></div>
        <div class="field">
          <label>رمز عبور</label>
          <input type="password" id="deletePassword" placeholder="••••••••" />
        </div>
        <div class="modal-actions">
          <button class="btn btn--ghost" id="cancelDelete">انصراف</button>
          <button class="btn btn--danger" id="confirmDelete">حذف همیشگی حساب</button>
        </div>
      </div>
    </div>

    <div class="settings-overlay" id="settingsOverlay" style="display:none;">
      <div class="settings-drawer">
        <div class="settings-drawer__head">
          <h2>تنظیمات</h2>
          <button class="icon-btn" id="closeSettingsBtn">✕</button>
        </div>
        <div class="settings-drawer__body">
          <div class="settings-section">
            <h3>پروفایل</h3>
            <div class="field">
              <label>نام نمایشی</label>
              <input type="text" id="settingsDisplayName" />
            </div>
            <div class="form-msg" id="profileMsg"></div>
            <button class="btn" id="saveProfileBtn">ذخیره نام</button>
          </div>

          <div class="settings-section">
            <h3>ایمیل</h3>
            <div class="field">
              <label>ایمیل جدید</label>
              <input type="email" id="settingsEmail" />
            </div>
            <div class="field">
              <label>رمز عبور فعلی (برای تایید)</label>
              <input type="password" id="settingsEmailPassword" placeholder="••••••••" />
            </div>
            <div class="form-msg" id="emailSettingsMsg"></div>
            <button class="btn" id="saveEmailBtn">ذخیره ایمیل</button>
          </div>

          <div class="settings-section">
            <h3>ظاهر برنامه</h3>
            <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:8px;">تم رنگی</label>
            <div class="option-row">
              <div class="theme-swatch" data-theme="olive" title="زیتونی" style="background:linear-gradient(135deg,#0a0d08,#7a8a4a)"></div>
              <div class="theme-swatch" data-theme="amber" title="کهربایی" style="background:linear-gradient(135deg,#14100e,#c9793a)"></div>
            </div>
            <label style="font-size:12px;color:var(--text-muted);display:block;margin:14px 0 8px;">فونت</label>
            <div class="option-row" id="fontOptions">
              <div class="option-pill" data-font="rajdhani">راجدانی</div>
              <div class="option-pill" data-font="vazir">وزیرمتن</div>
            </div>
            <label style="font-size:12px;color:var(--text-muted);display:block;margin:14px 0 8px;">اندازه‌ی متن</label>
            <div class="option-row" id="sizeOptions">
              <div class="option-pill" data-size="small">کوچیک</div>
              <div class="option-pill" data-size="medium">معمولی</div>
              <div class="option-pill" data-size="large">بزرگ</div>
            </div>
          </div>

          <div class="settings-section">
            <h3>منطقه‌ی خطر</h3>
            <button class="btn btn--danger" id="deleteAccountBtn">حذف حساب</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
