<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Zaytun — ثبت‌نام</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/settings-apply.js"></script>
</head>
<body>
  <div class="app-shell">
    <div class="titlebar">
      <div class="titlebar__mark"><b>ZAY</b>TUN</div>
      <div class="titlebar__controls">
        <button class="titlebar__btn" id="min"><svg viewBox="0 0 12 12"><rect y="5.5" width="12" height="1.4" fill="currentColor"/></svg></button>
        <button class="titlebar__btn close" id="close"><svg viewBox="0 0 12 12"><line x1="0" y1="0" x2="12" y2="12" stroke="currentColor" stroke-width="1.4"/><line x1="12" y1="0" x2="0" y2="12" stroke="currentColor" stroke-width="1.4"/></svg></button>
      </div>
    </div>

    <div class="app-body auth-body">
      <div class="auth-brand">
        <div class="auth-brand__foot">GROUP · PRIVATE · ENCRYPTED LINE</div>
        <div class="auth-brand__word">
          <span style="animation-delay:.05s">Z</span><span style="animation-delay:.1s">a</span><span style="animation-delay:.15s" class="g">y</span><span style="animation-delay:.2s">t</span><span style="animation-delay:.25s">u</span><span style="animation-delay:.3s">n</span>
        </div>
        <p class="auth-brand__tag">فقط چند ثانیه طول می‌کشه. یه اسم کاربری، یه اسم نمایشی، و یه رمز عبور.</p>
      </div>

      <div class="auth-form-wrap">
        <form class="auth-form" id="registerForm">
          <h1>ثبت‌نام</h1>
          <p class="sub">یه حساب برای خودت تو گروه بساز.</p>

          <div class="form-msg" id="msg"></div>

          <div class="field">
            <label>نام نمایشی</label>
            <input type="text" id="displayName" placeholder="مثلاً: سینا" />
          </div>
          <div class="field">
            <label>نام کاربری</label>
            <input type="text" id="username" autocomplete="username" placeholder="بدون فاصله، مثلاً: sina" />
          </div>
          <div class="field">
            <label>ایمیل</label>
            <input type="email" id="email" autocomplete="email" placeholder="مثلاً: sina@gmail.com" />
          </div>
          <div class="field">
            <label>رمز عبور</label>
            <input type="password" id="password" autocomplete="new-password" placeholder="حداقل ۴ کاراکتر" />
          </div>

          <button type="submit" class="btn" id="submitBtn">ساخت حساب</button>

          <div class="auth-switch">
            قبلاً ثبت‌نام کردی؟ <a id="goLogin">برو صفحه‌ی ورود</a>
          </div>
          <div class="made-by">ساخته شده توسط <b>هومن</b></div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
