<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Zaytun — بازیابی رمز عبور</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/settings-apply.js"></script>
</head>
<body>
  <div class="app-shell">
    <div class="titlebar">
      <div class="titlebar__mark"><b>ZAY</b>TUN</div>
      <div class="titlebar__controls">
        <button class="titlebar__btn" id="min"><svg viewBox="0 0 12 12"><rect y="5.5" width="12" height="1.4" fill="currentColor"/></svg></button>
        <button class="titlebar__btn close" id="close"><svg viewBox="0 0 12 12"><line x1="0" y1="0" x2="12" y2="12" stroke="currentColor" stroke-width="1.4"/><line x1="12" y1="0" x2="0" y2="12" stroke="currentColor" stroke-width="1.4"/></svg></button>
      </div>
    </div>

    <div class="app-body auth-body">
      <div class="auth-brand">
        <div class="auth-brand__foot">GROUP · PRIVATE · ENCRYPTED LINE</div>
        <div class="auth-brand__word">
          <span style="animation-delay:.05s">Z</span><span style="animation-delay:.1s">a</span><span style="animation-delay:.15s" class="g">y</span><span style="animation-delay:.2s">t</span><span style="animation-delay:.25s">u</span><span style="animation-delay:.3s">n</span>
        </div>
        <p class="auth-brand__tag">یه کد بازیابی برات ایمیل می‌کنیم، وارد کن و رمز جدید بساز.</p>
      </div>

      <div class="auth-form-wrap">
        <form class="auth-form" id="stepEmailForm">
          <h1>بازیابی رمز عبور</h1>
          <p class="sub">ایمیلی که باهاش ثبت‌نام کردی رو وارد کن.</p>
          <div class="form-msg" id="emailMsg"></div>
          <div class="field">
            <label>ایمیل</label>
            <input type="email" id="fpEmail" placeholder="مثلاً: sina@gmail.com" />
          </div>
          <button type="submit" class="btn" id="sendCodeBtn">ارسال کد بازیابی</button>
          <div class="auth-switch"><a id="backToLogin1">برگشت به ورود</a></div>
        </form>

        <form class="auth-form" id="stepResetForm" style="display:none;">
          <h1>کد رو وارد کن</h1>
          <p class="sub">کد ۶ رقمی که ایمیل شد رو وارد کن و رمز جدیدت رو بساز.</p>
          <div class="form-msg" id="resetMsg"></div>
          <div class="field">
            <label>کد ۶ رقمی</label>
            <input type="text" id="fpCode" maxlength="6" placeholder="------" />
          </div>
          <div class="field">
            <label>رمز عبور جدید</label>
            <input type="password" id="fpNewPassword" placeholder="حداقل ۴ کاراکتر" />
          </div>
          <button type="submit" class="btn" id="resetBtn">تغییر رمز عبور</button>
          <div class="auth-switch"><a id="backToLogin2">برگشت به ورود</a></div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
